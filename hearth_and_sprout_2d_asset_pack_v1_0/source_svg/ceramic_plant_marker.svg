      <path d="M518 742 C534 740 546 738 556 734 L552 786 L512 894 L520 782 Z"
            fill="#B76946"/>
      <!-- Re-stroke stake cleanly -->
      <path d="M446 474 L578 474 L554 786 L512 898 L470 786 Z"
            fill="none" stroke="#2D1E18" stroke-width="13.8"/>

      <!-- Small decorative plum ceramic collar bead where plaque meets stake -->
      <path d="M430 456 C474 446 550 446 594 456 L588 494 C548 506 476 506 436 494 Z"
            fill="#946A75" stroke="#2D1E18" stroke-width="11.5"/>

      <!-- Scalloped arched dusty-teal ceramic top plaque with honey rim -->
      <!-- Outer honey glazed scalloped border -->
      <path d="M312 316 C312 204 402 128 512 128 C622 128 712 204 712 316 C726 352 712 396 680 416 C666 452 624 472 580 468 L444 468 C400 472 358 452 344 416 C312 396 298 352 312 316 Z"
            fill="#EEB45D" stroke="#2D1E18" stroke-width="13.8"/>
      <!-- Shaded right rim depth -->
      <path d="M512 132 C622 132 710 206 710 316 C724 352 710 394 678 414 C664 450 624 468 580 464 L548 464 C624 440 676 374 674 294 C672 208 604 148 512 132 Z"
            fill="#CE9044"/>
      <!-- Re-stroke outer scalloped plaque -->
      <path d="M312 316 C312 204 402 128 512 128 C622 128 712 204 712 316 C726 352 712 396 680 416 C666 452 624 472 580 468 L444 468 C400 472 358 452 344 416 C312 396 298 352 312 316 Z"
            fill="none" stroke="#2D1E18" stroke-width="13.8"/>

      <!-- Inner dusty-teal glazed face -->
      <path d="M352 316 C352 228 424 168 512 168 C600 168 672 228 672 316 C672 384 624 432 560 432 L464 432 C400 432 352 384 352 316 Z"
            fill="#76A099" stroke="#2D1E18" stroke-width="11.5"/>
      <!-- Gentle glaze shading on right inside teal face -->
      <path d="M552 174 C624 192 670 248 670 316 C670 382 622 430 560 430 L520 430 C586 408 626 358 626 294 C626 236 596 196 552 174 Z"
            fill="#608882"/>
      <!-- Glaze highlight arc on upper-left -->
      <path d="M380 286 C388 232 432 194 484 188" stroke="#F8EAD5" stroke-width="11.5" fill="none" opacity="0.72"/>

      <!-- Central oat-cream ceramic medallion holding ONLY a clean abstract sprout emblem (NO text!) -->
      <circle cx="512" cy="304" r="96" fill="#F8EAD5" stroke="#2D1E18" stroke-width="9"/>
      <!-- Abstract botanical sprout icon in moss & sage -->
      <path d="M512 372 L512 270" stroke="#2D1E18" stroke-width="12.6"/>
      <path d="M512 326 C462 320 436 284 452 250 C488 252 514 284 512 326 Z"
            fill="#96B098" stroke="#2D1E18" stroke-width="9"/>
      <path d="M512 312 C562 304 588 268 572 234 C536 236 510 268 512 312 Z"
            fill="#667D60" stroke="#2D1E18" stroke-width="9"/>
      <!-- Tiny rising sun dot above sprout -->
      <circle cx="512" cy="238" r="14" fill="#EEB45D" stroke="#2D1E18" stroke-width="6.5"/>
      <!-- Curved soil mound arc under sprout -->
      <path d="M462 374 C488 358 536 358 562 374" fill="none" stroke="#DC8A63" stroke-width="11.5"/>
      <path d="M462 374 C488 358 536 358 562 374" fill="none" stroke="#2D1E18" stroke-width="4.5"/>

      <!-- Small ceramic hanging hole at top of plaque -->
      <circle cx="512" cy="148" r="9" fill="#2D1E18"/>
    </g>
  </g>
</svg>
