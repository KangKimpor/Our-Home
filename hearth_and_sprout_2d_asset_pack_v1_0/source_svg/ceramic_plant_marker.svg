<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="hand-ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="211" result="hand"/>
      <feDisplacementMap in="SourceGraphic" in2="hand" scale="5.6" xChannelSelector="R" yChannelSelector="G" result="h1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="2" seed="401" result="nib"/>
      <feDisplacementMap in="h1" in2="nib" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand-ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gently angled ceramic stoneware plant marker stake -->
    <g transform="rotate(-10 512 512)">
      <!-- Tapered oat-cream glazed stoneware stake body -->
      <path d="M446 474 L578 474 L554 786 L512 898 L470 786 Z"
            fill="#F8EAD5" stroke="#2D1E18" stroke-width="13.8"/>
      <!-- Right-side 3D thickness shading on stoneware stake -->
      <path d="M524 478 L574 478 L552 784 L512 894 L526 780 Z"
            fill="#E4D0B0"/>
      <!-- Upper-left glaze highlight -->
      <path d="M468 506 L484 714" stroke="#FDF6E9" stroke-width="13.8" fill="none"/>

      <!-- Dipped terracotta clay pointed bottom tip -->
      <path d="M466 734 C492 746 532 746 558 734 L554 786 L512 898 L470 786 Z"
